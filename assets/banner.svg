<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Amineos. One VPS. No cloud provider. Independent full-stack engineer.">
<!-- (c) 2026 Amineos. All rights reserved. The logo and animation may not be copied or reused. -->
  <title>Amineos. One VPS. No cloud provider.</title>
  <style>
    .b { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(0);
         animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards; }
    .lit { animation-name: pop, glow; animation-duration: .5s, .9s;
           animation-timing-function: cubic-bezier(.34,1.56,.64,1), cubic-bezier(.16,1,.3,1);
           animation-fill-mode: forwards, forwards; }
    .ring { transform-box: fill-box; transform-origin: center; opacity: 0; fill: none; stroke: #8dff4f; stroke-width: 3;
            animation: ring .9s cubic-bezier(.16,1,.3,1) forwards; }
    .t { opacity: 0; transform: translateY(14px); animation: up .8s cubic-bezier(.16,1,.3,1) forwards; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
           animation: fill 1.8s cubic-bezier(.65,0,.35,1) 1.3s forwards; }
    @keyframes pop { to { opacity: 1; transform: scale(1); } }
    @keyframes glow { 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
    @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    @keyframes up { to { opacity: 1; transform: none; } }
    @keyframes fill { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .b, .lit, .t, .bar { animation: none; opacity: 1; transform: none; }
      .ring { display: none; }
    }
  </style>
  <rect width="1200" height="320" fill="#16181d"/>
  <g transform="translate(248 58) scale(.82)">
    <rect class="b" style="animation-delay:0.25s" x="10" y="202" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.30s" x="202" y="202" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.35s" x="10" y="154" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.40s" x="202" y="154" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.45s" x="10" y="106" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.50s" x="58" y="106" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.55s" x="154" y="106" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.60s" x="202" y="106" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.65s" x="10" y="58" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.70s" x="202" y="58" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.75s" x="58" y="10" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.80s" x="106" y="10" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="b" style="animation-delay:0.85s" x="154" y="10" width="44" height="44" rx="9" fill="#eceae4"/>
    <rect class="ring" style="animation-delay:1.00s" x="106" y="106" width="44" height="44" rx="9"/>
    <rect class="b lit" style="animation-delay:1.00s,1.00s" x="106" y="106" width="44" height="44" rx="9" fill="#8dff4f"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text class="t" style="animation-delay:1.05s" x="536" y="158" font-size="96" font-weight="800" letter-spacing="-3" fill="#eceae4">Amineos</text>
    <text class="t" style="animation-delay:1.2s" x="540" y="212" font-size="31" font-weight="600" fill="#8dff4f">One VPS. No cloud provider.</text>
    <text class="t" style="animation-delay:1.35s" x="540" y="254" font-size="22" font-weight="500" fill="#a3a7b3">Independent full-stack engineer</text>
  </g>
  <rect x="0" y="314" width="1200" height="6" fill="#3a3f4a"/>
  <rect class="bar" x="0" y="314" width="1200" height="6" fill="#8dff4f"/>
</svg>
